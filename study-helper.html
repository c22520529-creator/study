<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>讀書輔助小工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .sidebar {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .sidebar h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        select, input, button, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
            font-family: inherit;
        }

        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-btn {
            padding: 10px 20px;
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-weight: 500;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .material-card {
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .material-card:hover {
            background: #f0f0f0;
            transform: translateX(5px);
        }

        .material-card h3 {
            color: #667eea;
            margin-bottom: 5px;
        }

        .material-card p {
            color: #666;
            font-size: 0.9em;
        }

        .note-item {
            background: #fffacd;
            border-left: 4px solid #ffd700;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            position: relative;
        }

        .note-item .delete-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8em;
        }

        .quiz-question {
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        .quiz-question h4 {
            color: #333;
            margin-bottom: 10px;
        }

        .quiz-option {
            margin-bottom: 8px;
        }

        .quiz-option input[type="radio"] {
            margin-right: 10px;
        }

        .quiz-option label {
            display: inline;
            margin: 0;
            font-weight: normal;
        }

        .result-message {
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            font-weight: 500;
        }

        .result-correct {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .result-wrong {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
        }

        .stat-card h4 {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .stat-card .number {
            font-size: 2em;
            font-weight: bold;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 30px;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-weight: 500;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 讀書輔助小工具</h1>
            <p>搜尋教材、記筆記、做測驗</p>
        </header>

        <div class="main-content">
            <!-- 左邊：搜尋和選擇 -->
            <div class="sidebar">
                <h2>🔍 搜尋教材</h2>
                
                <div class="form-group">
                    <label for="schoolYear">學年度：</label>
                    <select id="schoolYear">
                        <option value="">選擇學年度</option>
                        <option value="113">113年</option>
                        <option value="114">114年</option>
                        <option value="115">115年</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="grade">年級：</label>
                    <select id="grade">
                        <option value="">選擇年級</option>
                        <option value="7">國一</option>
                        <option value="8">國二</option>
                        <option value="9">國三</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="version">版本：</label>
                    <select id="version">
                        <option value="">選擇版本</option>
                        <option value="nanyi">南一</option>
                        <option value="kangxuan">康軒</option>
                        <option value="hanlin">翰林</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="subject">科目：</label>
                    <select id="subject">
                        <option value="">選擇科目</option>
                        <option value="chinese">國文</option>
                        <option value="english">英文</option>
                        <option value="math">數學</option>
                        <option value="science">自然</option>
                        <option value="social">社會</option>
                    </select>
                </div>

                <button onclick="searchMaterials()">搜尋</button>

                <hr style="margin: 20px 0; border: none; border-top: 1px solid #e0e0e0;">

                <h2>📊 學習進度</h2>
                <div class="stats" id="stats">
                    <div class="stat-card">
                        <h4>總筆記數</h4>
                        <div class="number" id="noteCount">0</div>
                    </div>
                    <div class="stat-card">
                        <h4>測驗次數</h4>
                        <div class="number" id="quizCount">0</div>
                    </div>
                </div>
            </div>

            <!-- 右邊：主要內容 -->
            <div class="content">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('materials')">教材</button>
                    <button class="tab-btn" onclick="switchTab('notes')">筆記</button>
                    <button class="tab-btn" onclick="switchTab('quiz')">測驗</button>
                </div>

                <!-- 教材 Tab -->
                <div id="materials" class="tab-content active">
                    <h2>教材列表</h2>
                    <div id="materialsList" class="empty-state">
                        <p>選擇年級和科目後按搜尋 👇</p>
                    </div>
                </div>

                <!-- 筆記 Tab -->
                <div id="notes" class="tab-content">
                    <h2>新增筆記</h2>
                    <div class="form-group">
                        <label for="noteTitle">筆記標題：</label>
                        <input type="text" id="noteTitle" placeholder="例如：第一章重點">
                    </div>
                    <div class="form-group">
                        <label for="noteContent">筆記內容：</label>
                        <textarea id="noteContent" placeholder="寫下你的筆記..."></textarea>
                    </div>
                    <button onclick="addNote()">💾 存筆記</button>

                    <hr style="margin: 20px 0;">

                    <h3>我的筆記</h3>
                    <div id="notesList" class="empty-state">
                        <p>還沒有筆記呢</p>
                    </div>
                </div>

                <!-- 測驗 Tab -->
                <div id="quiz" class="tab-content">
                    <h2>練習測驗</h2>
                    <div id="quizContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <script>
        // Firebase 設定
        const firebaseConfig = {
            apiKey: "AIzaSyAbQpIGMFJt1fU0um4eKae06S8VnrphHTU",
            authDomain: "study-aecd4.firebaseapp.com",
            projectId: "study-aecd4",
            storageBucket: "study-aecd4.appspot.com",
            messagingSenderId: "803664497994",
            appId: "1:803664497994:web:3dfde8135fdd1e899905b3",
            measurementId: "G-2WB150FKD3"
        };

        // 初始化 Firebase（延迟初始化以确保 SDK 已加载）
        setTimeout(() => {
            if (typeof firebase !== 'undefined') {
                firebase.initializeApp(firebaseConfig);
                window.db = firebase.firestore();
            }
        }, 100);

        // 教材資料（用户提供的真實內容）
        const sampleMaterials = [
            // 國一數學 - 第一章：整數的運算
            {id: 1, schoolYear: '113', grade: '7', version: 'nanyi', subject: 'math', title: '第一章：整數的運算', chapter: '1', content: '正負數與絕對值：認識數線、相反數，以及代表點到原點距離的「絕對值」。整數的加減法：學習去括號法則與正負數相加減的邏輯。整數的乘除與四則運算：掌握「正正得正、負負得正、正負得負」的乘除法與先乘除後加減的運算順序。科學記號：學習指數的定義與指數律，並用科學記號（a × 10^n）表示極大或極小的數字。'},
            {id: 2, schoolYear: '113', grade: '7', version: 'kangxuan', subject: 'math', title: '第一章：整數的運算', chapter: '1', content: '正負數與絕對值：認識數線、相反數，以及代表點到原點距離的「絕對值」。整數的加減法：學習去括號法則與正負數相加減的邏輯。整數的乘除與四則運算：掌握「正正得正、負負得正、正負得負」的乘除法與先乘除後加減的運算順序。科學記號：學習指數的定義與指數律，並用科學記號（a × 10^n）表示極大或極小的數字。'},
            {id: 3, schoolYear: '113', grade: '7', version: 'hanlin', subject: 'math', title: '第一章：整數的運算', chapter: '1', content: '正負數與絕對值：認識數線、相反數，以及代表點到原點距離的「絕對值」。整數的加減法：學習去括號法則與正負數相加減的邏輯。整數的乘除與四則運算：掌握「正正得正、負負得正、正負得負」的乘除法與先乘除後加減的運算順序。科學記號：學習指數的定義與指數律，並用科學記號（a × 10^n）表示極大或極小的數字。'},

            // 國一數學 - 第二章：分數的運算
            {id: 4, schoolYear: '113', grade: '7', version: 'nanyi', subject: 'math', title: '第二章：分數的運算', chapter: '2', content: '質因數分解與最大公因數、最小公倍數：學習質數與合數、短除法、標準分解式，並解決生活中的分組、分配與週期問題。分數的加減運算：將正負號導入分數，進行通分與加減。分數的乘除與四則運算：學習分數的乘除、倒數觀念、分數的指數律與正負分數的混合四則運算。'},
            {id: 5, schoolYear: '113', grade: '7', version: 'kangxuan', subject: 'math', title: '第二章：分數的運算', chapter: '2', content: '質因數分解與最大公因數、最小公倍數：學習質數與合數、短除法、標準分解式，並解決生活中的分組、分配與週期問題。分數的加減運算：將正負號導入分數，進行通分與加減。分數的乘除與四則運算：學習分數的乘除、倒數觀念、分數的指數律與正負分數的混合四則運算。'},
            {id: 6, schoolYear: '113', grade: '7', version: 'hanlin', subject: 'math', title: '第二章：分數的運算', chapter: '2', content: '質因數分解與最大公因數、最小公倍數：學習質數與合數、短除法、標準分解式，並解決生活中的分組、分配與週期問題。分數的加減運算：將正負號導入分數，進行通分與加減。分數的乘除與四則運算：學習分數的乘除、倒數觀念、分數的指數律與正負分數的混合四則運算。'},

            // 國一數學 - 第三章：一元一次方程式
            {id: 7, schoolYear: '113', grade: '7', version: 'nanyi', subject: 'math', title: '第三章：一元一次方程式', chapter: '3', content: '代數式的化簡：學習用文字符號（如 x）代替數，並進行同類項合併（例如：3x + 2x = 5x）。一元一次方程式的解法：利用「等量公理」與「移項法則」求出未知數。應用問題：將生活情境（如：買賣賺賠、分配帳目、行程速度問題）轉譯為方程式並求解。'},
            {id: 8, schoolYear: '113', grade: '7', version: 'kangxuan', subject: 'math', title: '第三章：一元一次方程式', chapter: '3', content: '代數式的化簡：學習用文字符號（如 x）代替數，並進行同類項合併（例如：3x + 2x = 5x）。一元一次方程式的解法：利用「等量公理」與「移項法則」求出未知數。應用問題：將生活情境（如：買賣賺賠、分配帳目、行程速度問題）轉譯為方程式並求解。'},
            {id: 9, schoolYear: '113', grade: '7', version: 'hanlin', subject: 'math', title: '第三章：一元一次方程式', chapter: '3', content: '代數式的化簡：學習用文字符號（如 x）代替數，並進行同類項合併（例如：3x + 2x = 5x）。一元一次方程式的解法：利用「等量公理」與「移項法則」求出未知數。應用問題：將生活情境（如：買賣賺賠、分配帳目、行程速度問題）轉譯為方程式並求解。'}
        ];

        // 測試題目資料（數學相關）
        const sampleQuizzes = [
            {
                question: '正數的定義是什麼？',
                options: ['大於0的數', '小於0的數', '等於0', '都不對'],
                correct: 0
            },
            {
                question: '1 + 2 × 3 = ?',
                options: ['9', '7', '11', '5'],
                correct: 0
            },
            {
                question: '|-5| 等於多少？',
                options: ['5', '-5', '0', '不知道'],
                correct: 0
            },
            {
                question: '(-3) × (-4) = ?',
                options: ['12', '-12', '7', '-1'],
                correct: 0
            },
            {
                question: '3x + 2x 化簡後等於？',
                options: ['5x', '6x', 'x', '5x²'],
                correct: 0
            }
        ];

        let currentMaterials = [];
        let currentNotes = [];
        let currentQuizAnswers = {};

        // 切換 Tab
        function switchTab(tabName) {
            // 隱藏所有 Tab
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // 顯示選中的 Tab
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            // 加載對應的內容
            if (tabName === 'notes') {
                loadNotes();
            } else if (tabName === 'quiz') {
                loadQuiz();
            }
        }

        // 搜尋教材
        function searchMaterials() {
            const schoolYear = document.getElementById('schoolYear').value;
            const grade = document.getElementById('grade').value;
            const version = document.getElementById('version').value;
            const subject = document.getElementById('subject').value;

            if (!grade || !subject) {
                alert('請至少選擇年級和科目');
                return;
            }

            // 過濾教材
            currentMaterials = sampleMaterials.filter(material => {
                if (material.grade !== grade) return false;
                if (material.subject !== subject) return false;
                if (schoolYear && material.schoolYear !== schoolYear) return false;
                if (version && material.version !== version) return false;
                return true;
            });

            displayMaterials();
        }

        // 顯示教材
        function displayMaterials() {
            const list = document.getElementById('materialsList');

            if (currentMaterials.length === 0) {
                list.innerHTML = '<p class="empty-state">找不到相關教材</p>';
                return;
            }

            const versionMap = {
                'nanyi': '南一',
                'kangxuan': '康軒',
                'hanlin': '翰林'
            };

            list.innerHTML = currentMaterials.map(material => `
                <div class="material-card" onclick="selectMaterial(${material.id})">
                    <h3>${material.title}</h3>
                    <small style="color: #999;">
                        ${material.schoolYear}年 | ${versionMap[material.version]}版
                    </small>
                    <p>${material.content.substring(0, 80)}...</p>
                </div>
            `).join('');
        }

        // 選擇教材（可在此做更多事）
        function selectMaterial(id) {
            const material = currentMaterials.find(m => m.id === id);
            alert(`✅ 已選擇：${material.title}\n\n${material.content}`);
        }

        // 新增筆記
        async function addNote() {
            const title = document.getElementById('noteTitle').value;
            const content = document.getElementById('noteContent').value;

            if (!title || !content) {
                alert('請填入標題和內容');
                return;
            }

            if (!window.db) {
                alert('Firebase 還在初始化中，請稍候...');
                return;
            }

            try {
                await window.db.collection('notes').add({
                    title: title,
                    content: content,
                    timestamp: new Date()
                });

                document.getElementById('noteTitle').value = '';
                document.getElementById('noteContent').value = '';
                
                loadNotes();
                updateStats();
                alert('✅ 筆記已保存！');
            } catch (error) {
                console.error('Error adding note:', error);
                alert('❌ 保存失敗');
            }
        }

        // 加載筆記
        async function loadNotes() {
            if (!window.db) {
                console.log('Firebase 未初始化');
                return;
            }

            try {
                const snapshot = await window.db.collection('notes').orderBy('timestamp', 'desc').get();
                const notesList = document.getElementById('notesList');

                if (snapshot.empty) {
                    notesList.innerHTML = '<p class="empty-state">還沒有筆記呢</p>';
                    return;
                }

                currentNotes = [];
                notesList.innerHTML = snapshot.docs.map(doc => {
                    currentNotes.push({id: doc.id, ...doc.data()});
                    return `
                        <div class="note-item">
                            <h4>${doc.data().title}</h4>
                            <p>${doc.data().content}</p>
                            <small style="color: #999;">
                                ${new Date(doc.data().timestamp.toDate()).toLocaleString('zh-TW')}
                            </small>
                            <button class="delete-btn" onclick="deleteNote('${doc.id}')">刪除</button>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading notes:', error);
            }
        }

        // 刪除筆記
        async function deleteNote(id) {
            if (!confirm('確定要刪除這筆筆記嗎？')) return;

            if (!window.db) {
                alert('Firebase 還在初始化中');
                return;
            }

            try {
                await window.db.collection('notes').doc(id).delete();
                loadNotes();
                updateStats();
                alert('✅ 筆記已刪除');
            } catch (error) {
                console.error('Error deleting note:', error);
                alert('❌ 刪除失敗');
            }
        }

        // 加載測驗
        function loadQuiz() {
            const container = document.getElementById('quizContainer');
            
            container.innerHTML = `
                ${sampleQuizzes.map((quiz, index) => `
                    <div class="quiz-question">
                        <h4>${index + 1}. ${quiz.question}</h4>
                        ${quiz.options.map((option, optIndex) => `
                            <div class="quiz-option">
                                <input type="radio" id="q${index}o${optIndex}" 
                                       name="question${index}" value="${optIndex}"
                                       onchange="currentQuizAnswers[${index}] = ${optIndex}">
                                <label for="q${index}o${optIndex}">${option}</label>
                            </div>
                        `).join('')}
                    </div>
                `).join('')}
                <button onclick="submitQuiz()">📝 提交答案</button>
            `;
        }

        // 提交測驗
        async function submitQuiz() {
            const answers = Object.values(currentQuizAnswers);
            if (answers.length !== sampleQuizzes.length) {
                alert('請回答所有問題');
                return;
            }

            let correct = 0;
            let feedback = '';

            sampleQuizzes.forEach((quiz, index) => {
                if (currentQuizAnswers[index] === quiz.correct) {
                    correct++;
                    feedback += `✅ 第 ${index + 1} 題正確\n`;
                } else {
                    feedback += `❌ 第 ${index + 1} 題錯誤（正確答案：${quiz.options[quiz.correct]}）\n`;
                }
            });

            const score = Math.round((correct / sampleQuizzes.length) * 100);

            // 保存測驗結果到 Firebase
            if (window.db) {
                try {
                    await window.db.collection('quiz_results').add({
                        score: score,
                        correctCount: correct,
                        totalCount: sampleQuizzes.length,
                        timestamp: new Date()
                    });

                    updateStats();
                } catch (error) {
                    console.error('Error saving quiz result:', error);
                }
            }

            alert(`測驗結果：${score}分\n${feedback}`);
            currentQuizAnswers = {};
            loadQuiz();
        }

        // 更新統計數據
        async function updateStats() {
            if (!window.db) {
                console.log('Firebase 未初始化');
                return;
            }

            try {
                const notesSnapshot = await window.db.collection('notes').get();
                const quizSnapshot = await window.db.collection('quiz_results').get();

                document.getElementById('noteCount').textContent = notesSnapshot.size;
                document.getElementById('quizCount').textContent = quizSnapshot.size;
            } catch (error) {
                console.error('Error updating stats:', error);
            }
        }

        // 頁面加載時初始化
        window.addEventListener('load', () => {
            updateStats();
        });
    </script>
</body>
</html>
