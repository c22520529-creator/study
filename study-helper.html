            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        select, input, button, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
            font-family: inherit;
        }

        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-btn {
            padding: 10px 20px;
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-weight: 500;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

            background: #f9f9f9;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;

        .material-card:hover {
            background: #f0f0f0;
            transform: translateX(5px);

            color: #667eea;
            margin-bottom: 5px;
        }

        .material-card p {
            color: #666;
            font-size: 0.9em;
        }

            border-left: 4px solid #ffd700;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            position: relative;

            right: 5px;

            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8em;

① 什麼是正數、負數？
生活中有很多東西可以用「方向」表示。
例如：賺 100 元 → +100，花掉 100 元 → -100
所以：正數通常表示「往正方向」，負數通常表示「往負方向」。
而 0 不屬於正數，也不屬於負數。

② 數線
←─── -3 ── -2 ── -1 ── 0 ── 1 ── 2 ── 3 ───→
越往右，數越大。越往左，數越小。
3 > 1，-1 > -3

③ 相反數
如果兩個數：距離 0 一樣遠、方向相反，它們就是相反數。
例如：+5 和 -5，+8 和 -8

1-2 絕對值
絕對值就是一個數到 0 的距離。
|3| = 3，|-3| = 3
絕對值不會是負數。

1-3 整數的加法
同號相加：數字相加，符號不變。
(+4) + (+3) = +7，(-4) + (-3) = -7
不同號相加：大的數減小的數，再看誰的「量」比較大。
5 + (-3) = 2，3 + (-7) = -4

1-4 整數的減法
減掉一個數 = 加上它的相反數
5 - 3 = 5 + (-3) = 2
5 - (-3) = 5 + 3 = 8

1-5 去括號
前面是 +：符號基本上不變。+(3 - 5) = +3 - 5
前面是 -：括號裡面的 +、- 全部反過來。-(3 - 5) = -3 + 5

1-6 整數的乘法
同號得正，異號得負。
3 × 4 = 12，(-3) × (-4) = 12
3 × (-4) = -12，(-3) × 4 = -12

1-7 整數的除法
除法的正負號規則跟乘法一樣：同號得正，異號得負。
12 ÷ 3 = 4，(-12) ÷ (-3) = 4

1-8 四則運算
先乘除，再加減。
3 + 2 × 4 = 3 + 8 = 11
有括號就先算括號。(3 + 2) × 4 = 5 × 4 = 20

1-9 科學記號
大數用正指數：300000000 = 3 × 10⁸
小數用負指數：0.000003 = 3 × 10⁻⁶`

質數是一個只能被 1 和自己整除的正整數。
例如：2、3、5、7、11、13 都是質數
合數是除了質數以外的正整數（大於 1）。
例如：4、6、8、9、10 都是合數
注意：1 不是質數，也不是合數。

2-2 質因數分解
質因數分解是把一個數寫成若干質數相乘的形式。
例如：12 = 2 × 2 × 3 = 2² × 3，24 = 2³ × 3
使用「短除法」進行分解。

2-3 最大公因數
最大公因數（GCD）是兩個數共同的因數中最大的。
例如：GCD(12, 18) = 6
用質因數分解求最大公因數：
12 = 2² × 3，18 = 2 × 3²
最大公因數 = 2 × 3 = 6

2-4 最小公倍數
最小公倍數（LCM）是兩個數共同的倍數中最小的。
例如：LCM(12, 18) = 36
用質因數分解求最小公倍數：
12 = 2² × 3，18 = 2 × 3²
最小公倍數 = 2² × 3² = 36

2-5 分數的加減法
分數相加減時，需要通分。
例如：1/3 + 1/6 = 2/6 + 1/6 = 3/6 = 1/2
負分數的加減：(-1/3) + 2/5 = (-5/15) + 6/15 = 1/15

2-6 分數的乘法
分子乘分子，分母乘分母。
(2/3) × (3/4) = 6/12 = 1/2
同號得正，異號得負。
(-2/3) × (-3/4) = 6/12 = 1/2

2-7 分數的除法
分數相除 = 乘以它的倒數。
(2/3) ÷ (3/4) = (2/3) × (4/3) = 8/9
(3/4) 的倒數是 (4/3)，分子分母互換。

2-8 分數的四則混合運算
先乘除，再加減。
1/2 + 1/3 × 1/2 = 1/2 + 1/6 = 3/6 + 1/6 = 2/3
有括號就先算括號。`

                content: `3-1 什麼是代數式
代數式是用文字和數字混合表示的式子。
例如：x + 5，3x - 2，2x + 3y
為什麼要用文字？因為有時我們不知道這個數是多少，需要用文字代替。
例如：某數加 5 等於 10，如果這個數是 x，就可以寫：x + 5 = 10

3-2 同類項與化簡
同類項是指文字部分相同的項。
例如：3x 和 2x 都含有 x，它們是同類項。
3x 和 3y 的文字不同，它們不是同類項。
只有同類項才能合併。
3x + 2x = 5x，但 3x + 2y 不能化簡。

3-3 一元一次方程式的定義
一元一次方程式是：含有一個未知數，未知數的最高次數是 1。
例如：x + 5 = 10 是一元一次方程式
2x - 3 = 7 是一元一次方程式
x² + 2x = 5 不是（有 x²，是二次）

3-4 等量公理
等號兩邊同時加上或減去相同的數，等式仍然成立。
等號兩邊同時乘以或除以相同的非零數，等式仍然成立。
例如：x + 5 = 10，兩邊同時減 5，得 x = 5

3-5 移項法則
移項是一種快速解方程式的方法。
等號一邊的項移到另一邊時，要改變符號。
例如：x + 5 = 10，把 +5 移到右邊變成 -5，得 x = 10 - 5 = 5

3-6 解一元一次方程式的步驟
1. 去括號（如果有的話）
2. 移項（把含 x 的項移到左邊，常數項移到右邊）
3. 化簡
4. 系數化為 1（兩邊同時除以 x 的係數）
例子：2(x - 3) = 10
第 1 步：2x - 6 = 10
第 2 步：2x = 16
第 3 步：x = 8

3-7 一元一次方程式的應用問題

1. 設未知數
2. 根據題意列出方程式
3. 解方程式
4. 驗證答案
例：某人買了一件衣服，打八折後花 640 元。原價多少？
設原價為 x 元，0.8x = 640，x = 800`

        // 測試題目資料（數學相關）
        const sampleQuizzes = [
            {
                question: '正數的定義是什麼？',
                options: ['大於0的數', '小於0的數', '等於0', '都不對'],
                correct: 0
            },
            {
                question: '1 + 2 × 3 = ?',
                options: ['9', '7', '11', '5'],
                correct: 0
            },
            {
                question: '|-5| 等於多少？',
                options: ['5', '-5', '0', '不知道'],
                correct: 0
            },
            {
                question: '(-3) × (-4) = ?',
                options: ['12', '-12', '7', '-1'],
                correct: 0
            },
            {
                question: '3x + 2x 化簡後等於？',
                options: ['5x', '6x', 'x', '5x²'],
                correct: 0
            }
        ];

        let currentMaterials = [];
        let currentNotes = [];
        let currentQuizAnswers = {};

        // 切換 Tab
        function switchTab(tabName) {
            // 隱藏所有 Tab
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // 顯示選中的 Tab
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            // 加載對應的內容
            if (tabName === 'notes') {
                loadNotes();
            } else if (tabName === 'quiz') {
                loadQuiz();
            }
        }

        // 搜尋教材
        function searchMaterials() {
            const schoolYear = document.getElementById('schoolYear').value;
            const grade = document.getElementById('grade').value;
            const version = document.getElementById('version').value;
            const subject = document.getElementById('subject').value;

            if (!grade || !subject) {
                alert('請至少選擇年級和科目');
                return;
            }

            // 過濾教材
            currentMaterials = sampleMaterials.filter(material => {
                if (material.grade !== grade) return false;
                if (material.subject !== subject) return false;
                if (schoolYear && material.schoolYear !== schoolYear) return false;
                if (version && material.version !== version) return false;
                return true;
            });

            displayMaterials();
        }

        // 顯示教材
        function displayMaterials() {
            const list = document.getElementById('materialsList');

            if (currentMaterials.length === 0) {
                list.innerHTML = '<p class="empty-state">找不到相關教材</p>';
                return;
            }

            const versionMap = {
                'nanyi': '南一',
                'kangxuan': '康軒',
                'hanlin': '翰林'
            };

            list.innerHTML = currentMaterials.map(material => `
                <div class="material-card" onclick="selectMaterial(${material.id})">
                    <h3>${material.title}</h3>
                    <small style="color: #999;">
                        ${material.schoolYear}年 | ${versionMap[material.version]}版
                    </small>
                    <p>${material.content.substring(0, 80)}...</p>
                </div>
            `).join('');
        }

        // 選擇教材（可在此做更多事）
        function selectMaterial(id) {
            const material = currentMaterials.find(m => m.id === id);
            alert(`✅ 已選擇：${material.title}\n\n${material.content}`);
        }

        // 新增筆記
        async function addNote() {
            const title = document.getElementById('noteTitle').value;
            const content = document.getElementById('noteContent').value;

            if (!title || !content) {
                alert('請填入標題和內容');
                return;
            }

            if (!window.db) {
                alert('Firebase 還在初始化中，請稍候...');
                return;
            }

            try {
                await window.db.collection('notes').add({
                    title: title,
                    content: content,
                    timestamp: new Date()
                });

                document.getElementById('noteTitle').value = '';
                document.getElementById('noteContent').value = '';
                
                loadNotes();
                updateStats();
                alert('✅ 筆記已保存！');
            } catch (error) {
                console.error('Error adding note:', error);
                alert('❌ 保存失敗');
            }
        }

        // 加載筆記
        async function loadNotes() {
            if (!window.db) {
                console.log('Firebase 未初始化');
                return;
            }

            try {
                const snapshot = await window.db.collection('notes').orderBy('timestamp', 'desc').get();
                const notesList = document.getElementById('notesList');

                if (snapshot.empty) {
                    notesList.innerHTML = '<p class="empty-state">還沒有筆記呢</p>';
                    return;
                }

                currentNotes = [];
                notesList.innerHTML = snapshot.docs.map(doc => {
                    currentNotes.push({id: doc.id, ...doc.data()});
                    return `
                        <div class="note-item">
                            <h4>${doc.data().title}</h4>
                            <p>${doc.data().content}</p>
                            <small style="color: #999;">
                                ${new Date(doc.data().timestamp.toDate()).toLocaleString('zh-TW')}
                            </small>
                            <button class="delete-btn" onclick="deleteNote('${doc.id}')">刪除</button>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading notes:', error);
            }
        }

        // 刪除筆記
        async function deleteNote(id) {
            if (!confirm('確定要刪除這筆筆記嗎？')) return;

            if (!window.db) {
                alert('Firebase 還在初始化中');
                return;
            }

            try {
                await window.db.collection('notes').doc(id).delete();
                loadNotes();
                updateStats();
                alert('✅ 筆記已刪除');
            } catch (error) {
                console.error('Error deleting note:', error);
                alert('❌ 刪除失敗');
            }
        }

        // 加載測驗
        function loadQuiz() {
            const container = document.getElementById('quizContainer');
            
            container.innerHTML = `
                ${sampleQuizzes.map((quiz, index) => `
                    <div class="quiz-question">
                        <h4>${index + 1}. ${quiz.question}</h4>
                        ${quiz.options.map((option, optIndex) => `
                            <div class="quiz-option">
                                <input type="radio" id="q${index}o${optIndex}" 
                                       name="question${index}" value="${optIndex}"
                                       onchange="currentQuizAnswers[${index}] = ${optIndex}">
                                <label for="q${index}o${optIndex}">${option}</label>
                            </div>
                        `).join('')}
                    </div>
                `).join('')}
                <button onclick="submitQuiz()">📝 提交答案</button>
            `;
        }

        // 提交測驗
        async function submitQuiz() {
            const answers = Object.values(currentQuizAnswers);
            if (answers.length !== sampleQuizzes.length) {
                alert('請回答所有問題');
                return;
            }

            let correct = 0;
            let feedback = '';

            sampleQuizzes.forEach((quiz, index) => {
                if (currentQuizAnswers[index] === quiz.correct) {
                    correct++;
                    feedback += `✅ 第 ${index + 1} 題正確\n`;
                } else {
                    feedback += `❌ 第 ${index + 1} 題錯誤（正確答案：${quiz.options[quiz.correct]}）\n`;
                }
            });

            const score = Math.round((correct / sampleQuizzes.length) * 100);

            // 保存測驗結果到 Firebase
            if (window.db) {
                try {
                    await window.db.collection('quiz_results').add({
                        score: score,
                        correctCount: correct,
                        totalCount: sampleQuizzes.length,
                        timestamp: new Date()
                    });

                    updateStats();
                } catch (error) {
                    console.error('Error saving quiz result:', error);
                }
            }

            alert(`測驗結果：${score}分\n${feedback}`);
            currentQuizAnswers = {};
            loadQuiz();
        }

        // 更新統計數據
        async function updateStats() {
            if (!window.db) {
                console.log('Firebase 未初始化');
                return;
            }

            try {
                const notesSnapshot = await window.db.collection('notes').get();
                const quizSnapshot = await window.db.collection('quiz_results').get();

                document.getElementById('noteCount').textContent = notesSnapshot.size;
                document.getElementById('quizCount').textContent = quizSnapshot.size;
            } catch (error) {
                console.error('Error updating stats:', error);
            }
        }

        // 頁面加載時初始化
        window.addEventListener('load', () => {
            updateStats();
        });
    </script>
